[project]
name = "black-letter-labs"
version = "0.1.0"
description = "code for solving black letter labs puzzles"
authors = [
    { name = "Bruce Oberg", email = "bruce@oberg.org" }
]
requires-python = ">=3.13"
dependencies = [
    "ocrmac>=1.0.1",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.3",
]

# Entry point: `uv run bll` or just `bll` inside the devenv shell.
# The CLI name (left of `=`) and the import path (right) both derive from
# the package name; update both if you rename the project.
[project.scripts]
bll = "bll.main:main"
ocr = "ocr.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bll"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyright>=1.1",
]
